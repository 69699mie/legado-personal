// app/download.gradle
// 由于原版 GitHub 下载链接可能失效（404），且项目本地已包含 cronetlib 文件
// 这里直接跳过下载逻辑，避免云端 CI 构建因网络问题失败

tasks.register("downloadCronet") {
    doLast {
        println "Skipping cronet download. Using existing files in app/cronetlib."
    }
}

afterEvaluate {
    tasks.named("preBuild") {
        dependsOn("downloadCronet")
    }
}