// download.gradle
def cronetVersion = project.hasProperty("CronetVersion") ? project.property("CronetVersion") : "119.6045.31"
def cronetMainVersion = project.hasProperty("CronetMainVersion") ? project.property("CronetMainVersion") : "119.6045.31"

def cronetDir = file("${projectDir}/cronetlib")
if (!cronetDir.exists()) {
    cronetDir.mkdirs()
}

def downloadFile(String urlStr, File dest) {
    if (dest.exists()) return
    println "Downloading $urlStr to $dest"
    new URL(urlStr).withInputStream { i ->
        dest.withOutputStream { o ->
            o << i
        }
    }
}

def baseUrl = "https://raw.githubusercontent.com/gedoor/legado/master/app/cronetlib/"
def cronetJar = new File(cronetDir, "cronet-api-${cronetVersion}.jar")
def cronetAar = new File(cronetDir, "cronet-impl-${cronetMainVersion}.aar")

// 只有在构建时才会触发下载
tasks.register("downloadCronet") {
    doLast {
        if (!cronetJar.exists()) downloadFile(baseUrl + cronetJar.name, cronetJar)
        if (!cronetAar.exists()) downloadFile(baseUrl + cronetAar.name, cronetAar)
    }
}

// 依赖编译前的任务
afterEvaluate {
    tasks.named("preBuild") {
        dependsOn("downloadCronet")
    }
}