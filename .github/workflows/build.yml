name: Build Personal APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # 明确指出使用最稳定的 ubuntu-22.04，避开 ubuntu-latest 迁移的未知风险
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        # 升级到最新版，兼容 Node 24
        uses: actions/checkout@v4

      - name: Set up JDK 21
        # 升级到 v5，彻底解决警告
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Setup Firebase Config
        run: |
          cat <<EOF > app/google-services.json
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "placeholder"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "io.legato.kazusa.debug"
                  }
                },
                "oauth_client": [],
                "api_key": [{"current_key": "placeholder"}]
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Build with Gradle
        env:
          # 限制 JVM 内存，降低 OOM 风险
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"
        run: |
          chmod +x ./gradlew
          # 加上 --info，这样如果在手机上向上翻找，能更容易看到编译错误的一手细节
          ./gradlew assembleDebug --no-daemon --stacktrace --info

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-legado-debug
          path: app/build/outputs/apk/debug/*.apk
