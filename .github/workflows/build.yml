name: Build Personal APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Setup Firebase Config
        run: |
          cat <<EOF > app/google-services.json
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "placeholder"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "io.legato.kazusa.debug"
                  }
                },
                "oauth_client": [],
                "api_key": [{"current_key": "placeholder"}]
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Build with Gradle
        continue-on-error: true
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Find and Check APK
        run: |
          echo "开始寻找 APK..."
          find app/build/outputs/apk/debug -name "*.apk"
          if [ ! -f app/build/outputs/apk/debug/*.apk ]; then
            echo "🔴 极其遗憾：没有找到 APK，说明 OOM 发生在真正的编译阶段，而不是结束阶段。"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-legado-debug
          path: app/build/outputs/apk/debug/*.apk
