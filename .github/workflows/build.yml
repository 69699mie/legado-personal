name: Build Personal APK

on:
  workflow_dispatch: # 仅手动触发

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read and Increment Version
        id: version
        run: |
          if [ -f version.txt ]; then
            CURRENT=$(cat version.txt | tr -d '[:space:]')
          else
            CURRENT=0
          fi
          V=$((CURRENT + 1))
          MAJOR=$(( (V - 1) / 10 + 1 ))
          MINOR=$(( (V - 1) % 10 ))
          if [ "$MINOR" -eq 0 ]; then
            VERSION_NAME="${MAJOR}.0"
          else
            VERSION_NAME="${MAJOR}.0${MINOR}"
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=$V" >> $GITHUB_OUTPUT
          echo "$V" > version.txt
          echo "New version: $VERSION_NAME (code: $V)"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Android SDK
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platform-tools" "ndk;27.0.12077973" "cmake;3.22.1"
          ln -sfn $ANDROID_SDK_ROOT/platforms/android-37.0 $ANDROID_SDK_ROOT/platforms/android-37 || true

      - name: Setup Firebase Config
        run: |
          cat <<EOF > app/google-services.json
          {
            "project_info": { "project_number": "000000000000", "project_id": "placeholder" },
            "client": [ { "client_info": { "mobilesdk_app_id": "1:000000000000:android:0000000000000000", "android_client_info": { "package_name": "com.mie.reading" } }, "oauth_client": [], "api_key": [{"current_key": "AIzaSyA1B2C3D4E5F6G7H8I9J0K1L2M3N4O5P6Q7"}] } ],
            "configuration_version": "1"
          }
          EOF

      - name: Build with Gradle
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PappVersionName=${{ steps.version.outputs.VERSION_NAME }} \
            -PappVersionCode=${{ steps.version.outputs.VERSION_CODE }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-legado-release
          path: app/build/outputs/apk/**/*.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ steps.version.outputs.VERSION_NAME }}
          name: 阅读专属版 v${{ steps.version.outputs.VERSION_NAME }}
          files: app/build/outputs/apk/**/*.apk
          generate_release_notes: true

      - name: Commit Version Bump
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add version.txt
          git commit -m "chore: bump version to ${{ steps.version.outputs.VERSION_NAME }}" || echo "No changes to commit"
          git push