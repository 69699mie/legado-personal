name: Unzip Source Code
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and Push
        run: |
          unzip -o source.zip
          rm -f source.zip
          # 严谨剔除：删除原项目所有的工作流文件，只保留我们自己的 build.yml
          find .github/workflows -type f ! -name 'build.yml' -delete
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "解压源码并导入" || echo "没有新文件需要提交"
          git push origin HEAD:main
